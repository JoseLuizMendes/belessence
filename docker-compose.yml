# Postgres local para DEV e TESTES do Belessence (custo zero, offline).
#
# Uso:
#   docker compose up -d        # sobe os dois bancos
#   docker compose down         # para (dados de DEV persistem no volume)
#   docker compose down -v      # para e APAGA os dados de DEV
#
#   DEV  → localhost:5544  · db belessence_dev   · dados persistem (5432 evitada: ha Postgres no host)
#   TEST → localhost:5433  · db belessence_test  · efêmero (use à vontade)
#
# Connection strings correspondentes:
#   DEV : postgresql://belessence:belessence@localhost:5544/belessence_dev?schema=public
#   TEST: postgresql://belessence:belessence@localhost:5433/belessence_test?schema=public

services:
  db:
    image: postgres:16
    container_name: belessence_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: belessence
      POSTGRES_PASSWORD: belessence
      POSTGRES_DB: belessence_dev
    ports:
      - "5544:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belessence -d belessence_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_test:
    image: postgres:16
    container_name: belessence_db_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: belessence
      POSTGRES_PASSWORD: belessence
      POSTGRES_DB: belessence_test
    ports:
      - "5433:5432"
    # Sem volume nomeado de propósito: dados de teste são descartáveis.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belessence -d belessence_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # UI web pra inspecionar o banco de DEV (estilo dashboard do Neon):
  # editor de SQL + navegador de tabelas em http://localhost:8081
  # (conecta sozinho no banco de dev via rede interna do compose).
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: belessence_pgweb
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      PGWEB_DATABASE_URL: postgres://belessence:belessence@db:5432/belessence_dev?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata_dev:
