name: Test

on:
  pull_request:
  push:
    branches: [master]

# Cancela execuções antigas do mesmo branch/PR (economiza minutos de CI).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unit + integração (Vitest) ───────────────────────────────────────────
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Versão do pnpm vem do campo "packageManager" do package.json (corepack/parity).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests with coverage
        run: pnpm test:coverage

  # ── E2E (Playwright) ─────────────────────────────────────────────────────
  # Sobe um Postgres efêmero, migra + seeda, e roda os fluxos contra o app.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: belessence
          POSTGRES_PASSWORD: belessence
          POSTGRES_DB: belessence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U belessence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://belessence:belessence@localhost:5432/belessence_test
      ADMIN_SECRET: e2e-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5

      # Versão do pnpm vem do campo "packageManager" do package.json (corepack/parity).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations + seed
        run: |
          pnpm prisma migrate deploy
          pnpm prisma db seed

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm test:e2e --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
